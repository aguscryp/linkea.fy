<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | linkea.fy</title>
    <!-- Librerías para QRs y exportación HD -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #050505;
            --card-dark: #0d0d0d;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --text-main: #ffffff;
            --text-muted: #777777;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        header h1 {
            color: var(--gold);
            font-size: 2.4rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 300;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 40px;
        }

        .card-box {
            background: var(--card-dark);
            border: 1px solid #1a1a1a;
            border-radius: 12px;
            padding: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
        }

        .card-meta {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .card-meta h3 {
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: #ddd;
        }

        .badge {
            font-size: 0.65rem;
            padding: 4px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 1.5px;
        }

        .badge-activa { background: rgba(40, 167, 69, 0.1); color: #2ecc71; border: 1px solid rgba(46, 204, 113, 0.2); }
        .badge-inactiva { background: rgba(231, 76, 60, 0.1); color: #e74c3c; border: 1px solid rgba(231, 76, 60, 0.2); }

        /* ==========================================================
           DISEÑO SUPREMO EMPRESARIAL - BLACK CARD LEVEL (8.5 x 5 cm)
           ========================================================== */
        .physical-card {
            width: 410px;
            height: 240px;
            background: linear-gradient(135deg, #111111 0%, #030303 100%);
            border: 1px solid var(--gold);
            border-radius: 8px; /* Ligeramente estilizada con elegancia de tarjeta de metal */
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            box-shadow: 0 20px 40px rgba(212, 175, 55, 0.15), inset 0 0 15px rgba(255,255,255,0.03);
            margin-bottom: 25px;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .brand-logo {
            color: var(--gold);
            font-size: 1.3rem;
            font-weight: 400;
            letter-spacing: 3px;
            text-transform: lowercase;
        }

        .card-middle {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Chip Bancario Empresarial Avanzado (Estilo EMV Realista) */
        .chip-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-start;
        }

        .bank-chip-pro {
            width: 45px;
            height: 35px;
            background: linear-gradient(135deg, #ebd197 0%, #d4af37 50%, #9a7b20 100%);
            border-radius: 4px;
            position: relative;
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.7), 0 4px 8px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        .bank-chip-pro::before {
            content: "";
            position: absolute;
            inset: 0;
            background: 
                linear-gradient(90deg, transparent 42%, rgba(0,0,0,0.25) 42%, rgba(0,0,0,0.25) 58%, transparent 58%),
                linear-gradient(0deg, transparent 42%, rgba(0,0,0,0.25) 42%, rgba(0,0,0,0.25) 58%, transparent 58%);
        }

        .contactless-icon {
            color: var(--gold);
            font-size: 1.1rem;
            letter-spacing: -2px;
            opacity: 0.8;
        }

        /* Marco QR Corporativo minimalista */
        .qr-frame {
            background: #ffffff;
            padding: 5px;
            border-radius: 3px;
            display: inline-block;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
        }

        .qr-frame canvas, .qr-frame img {
            display: block;
            width: 74px !important;
            height: 74px !important;
        }

        .card-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .card-titles-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .card-title-main {
            color: var(--text-main);
            font-size: 1.1rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .card-title-sub {
            color: var(--gold);
            font-size: 0.65rem;
            font-weight: 400;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0.85;
        }

        /* ==========================================
           BOTONES DE ACCIÓN
           ========================================== */
        .actions-grid {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn {
            background: transparent;
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 11px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            text-align: center;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn:hover {
            background: var(--gold);
            color: var(--bg-color);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }

        .btn-full {
            grid-column: span 2;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background: var(--card-dark);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid var(--gold);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            max-width: 90%;
        }

        .close-modal {
            position: absolute;
            top: 15px; right: 20px;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }
        .close-modal:hover { color: var(--text-main); }
    </style>
</head>
<body>

    <header>
        <h1>linkea.fy</h1>
        <p>Corporate Card Management • Black Gold Edition</p>
    </header>

    <div class="container" id="tarjetas-container">
        <!-- Contenido dinámico -->
    </div>

    <!-- Modal para ver tarjeta ampliada -->
    <div class="modal" id="cardModal">
        <div class="modal-content">
            <span class="close-modal" onclick="cerrarModal()">&times;</span>
            <h3 style="color: var(--gold); margin-bottom: 25px; font-weight: 400; letter-spacing: 2px;" id="modalTitle">Vista Previa</h3>
            <div id="modalCardContainer"></div>
        </div>
    </div>

    <script>
        const BASE_URL = window.location.origin + window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/')) + '/';

        async function cargarTarjetas() {
            try {
                const response = await fetch(`tarjetas.json?_=${new Date().getTime()}`);
                if (!response.ok) throw new Error('No se pudo cargar tarjetas.json');
                
                const tarjetas = await response.json();
                const container = document.getElementById('tarjetas-container');
                container.innerHTML = '';

                tarjetas.forEach(tarjeta => {
                    const urlPermanente = `${BASE_URL}t/${tarjeta.id}/`;
                    const cardIdUnico = `card-${tarjeta.id}`;
                    const qrIdUnico = `qr-${tarjeta.id}`;

                    const cardHTML = `
                        <div class="card-box">
                            <div class="card-meta">
                                <h3>ID: ${tarjeta.id} - ${tarjeta.nombre}</h3>
                                <span class="badge badge-${tarjeta.estado}">${tarjeta.estado}</span>
                            </div>

                            <!-- Tarjeta Física Suprema Black Gold (Sin nombre de negocio, solo marca y edición) -->
                            <div class="physical-card" id="${cardIdUnico}">
                                <div class="card-top">
                                    <div class="brand-logo">linkea.fy</div>
                                </div>
                                <div class="card-middle">
                                    <div class="chip-box">
                                        <div class="bank-chip-pro"></div>
                                        <div class="contactless-icon">&#187;&#187;</div>
                                    </div>
                                    <div class="qr-frame" id="${qrIdUnico}"></div>
                                </div>
                                <div class="card-bottom">
                                    <div class="card-titles-group">
                                        <div class="card-title-main">Black Gold</div>
                                        <div class="card-title-sub">Authorized Edition</div>
                                    </div>
                                </div>
                            </div>

                            <!-- Opciones individuales -->
                            <div class="actions-grid">
                                <button class="btn" onclick="verTarjeta('${cardIdUnico}', 'Tarjeta ID: ${tarjeta.id}')">Ver Tarjeta</button>
                                <button class="btn" onclick="descargarFoto('${cardIdUnico}', '${tarjeta.id}')">Descargar a Fotos</button>
                                <button class="btn btn-full" onclick="descargarPDF('${cardIdUnico}', 'Tarjeta-${tarjeta.id}')">Imprimir / Guardar PDF</button>
                            </div>
                        </div>
                    `;

                    container.innerHTML += cardHTML;

                    // CORRECCIÓN CLAVE: Limpiar el contenedor antes de generar el QR para evitar que se solapen o desaparezcan al haber múltiples tarjetas
                    const qrContainer = document.getElementById(qrIdUnico);
                    qrContainer.innerHTML = "";

                    // Generar QR de alto contraste para lectura instantánea
                    new QRCode(qrContainer, {
                        text: urlPermanente,
                        width: 74,
                        height: 74,
                        colorDark: "#000000",
                        colorLight: "#ffffff",
                        correctLevel: QRCode.CorrectLevel.H
                    });
                });

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('tarjetas-container').innerHTML = `
                    <p style="color: #e74c3c; text-align: center; grid-column: 1/-1;">
                        Error al cargar las tarjetas. Verifica que <strong>tarjetas.json</strong> esté en la raíz.
                    </p>`;
            }
        }

        // 1. Ver Tarjeta en Modal
        function verTarjeta(cardId, nombre) {
            const original = document.getElementById(cardId);
            const clone = original.cloneNode(true);
            document.getElementById('modalCardContainer').innerHTML = '';
            document.getElementById('modalCardContainer').appendChild(clone);
            document.getElementById('modalTitle').innerText = nombre;
            document.getElementById('cardModal').style.display = 'flex';
        }

        function cerrarModal() {
            document.getElementById('cardModal').style.display = 'none';
        }

        // 2. Descargar a Fotos en Full HD real (escala 4x)
        function descargarFoto(cardId, idTarjeta) {
            const elemento = document.getElementById(cardId);
            html2canvas(elemento, { 
                scale: 4, 
                backgroundColor: null,
                useCORS: true
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `tarjeta-${idTarjeta}-linkeafy-hd.png`;
                link.href = canvas.toDataURL('image/png', 1.0);
                link.click();
            });
        }

        // 3. Imprimir / Guardar PDF profesional a 8.5 x 5 cm
        function descargarPDF(cardId, nombre) {
            const elemento = document.getElementById(cardId).outerHTML;
            const ventanaPrint = window.open('', '_blank', 'width=900,height=700');
            ventanaPrint.document.write(`
                <!DOCTYPE html>
                <html lang="es">
                <head>
                    <meta charset="UTF-8">
                    <title>Imprimir ${nombre}</title>
                    <style>
                        body { background: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
                        .physical-card {
                            width: 85mm;
                            height: 50mm;
                            background: linear-gradient(135deg, #111111 0%, #030303 100%) !important;
                            border: 1px solid #d4af37;
                            border-radius: 8px;
                            padding: 30px;
                            display: flex;
                            flex-direction: column;
                            justify-content: space-between;
                            position: relative;
                            -webkit-print-color-adjust: exact;
                            print-color-adjust: exact;
                        }
                        .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
                        .brand-logo { color: #d4af37; font-size: 1.3rem; font-weight: 400; letter-spacing: 3px; font-family: sans-serif; text-transform: lowercase; }
                        .card-middle { display: flex; align-items: center; justify-content: space-between; }
                        .chip-box { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
                        .bank-chip-pro {
                            width: 45px;
                            height: 35px;
                            background: linear-gradient(135deg, #ebd197 0%, #d4af37 50%, #9a7b20 100%);
                            border-radius: 4px;
                            position: relative;
                        }
                        .bank-chip-pro::before {
                            content: "";
                            position: absolute;
                            inset: 0;
                            background: 
                                linear-gradient(90deg, transparent 42%, rgba(0,0,0,0.25) 42%, rgba(0,0,0,0.25) 58%, transparent 58%),
                                linear-gradient(0deg, transparent 42%, rgba(0,0,0,0.25) 42%, rgba(0,0,0,0.25) 58%, transparent 58%);
                        }
                        .contactless-icon { color: #d4af37; font-size: 1.1rem; letter-spacing: -2px; }
                        .qr-frame { background: #ffffff; padding: 5px; border-radius: 3px; display: inline-block; }
                        .qr-frame canvas, .qr-frame img { display: block; width: 74px !important; height: 74px !important; }
                        .card-bottom { display: flex; justify-content: space-between; align-items: flex-end; }
                        .card-titles-group { display: flex; flex-direction: column; gap: 3px; }
                        .card-title-main { color: #ffffff; font-size: 1.1rem; font-weight: 500; letter-spacing: 2px; font-family: sans-serif; text-transform: uppercase; }
                        .card-title-sub { color: #d4af37; font-size: 0.65rem; font-weight: 400; letter-spacing: 3px; font-family: sans-serif; text-transform: uppercase; }
                    </style>
                </head>
                <body>
                    ${elemento}
                    <script>
                        window.onload = function() { window.print(); window.close(); }
                    <\/script>
                </body>
                </html>
            `);
            ventanaPrint.document.close();
        }

        document.addEventListener('DOMContentLoaded', cargarTarjetas);
    </script>
</body>
</html>
