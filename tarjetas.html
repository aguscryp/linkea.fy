<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | linkea.fy</title>
    <!-- Librerías para QRs y exportación HD -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #030303;
            --card-dark: #0a0a0a;
            --gold-primary: #dfb15b;
            --gold-light: #f9f1df;
            --gold-dark: #996515;
            --text-main: #ffffff;
            --text-muted: #888888;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        header h1 {
            color: var(--gold-primary);
            font-size: 2.4rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 300;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(410px, 1fr));
            gap: 40px;
        }

        .card-box {
            background: var(--card-dark);
            border: 1px solid #1c1c1c;
            border-radius: 14px;
            padding: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }

        .card-meta {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .card-meta h3 {
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: #ddd;
        }

        .badge {
            font-size: 0.65rem;
            padding: 4px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 1.5px;
        }

        .badge-activa { background: rgba(40, 167, 69, 0.1); color: #2ecc71; border: 1px solid rgba(46, 204, 113, 0.2); }
        .badge-inactiva { background: rgba(231, 76, 60, 0.1); color: #e74c3c; border: 1px solid rgba(231, 76, 60, 0.2); }

        /* ==========================================================
           DISEÑO SUPREMO BANCARIO - BLACK CARD (8.5 x 5 cm)
           ========================================================== */
        .physical-card {
            width: 410px;
            height: 240px;
            background: radial-gradient(circle at 70% 20%, #1a1a1a 0%, #080808 70%, #020202 100%);
            border: 1.5px solid var(--gold-primary);
            border-radius: 10px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            box-shadow: 0 25px 50px rgba(223, 177, 91, 0.18), inset 0 0 20px rgba(255,255,255,0.04);
            margin-bottom: 25px;
            overflow: hidden;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            color: var(--gold-primary);
            font-size: 1.4rem;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: lowercase;
        }

        .card-middle {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* CHIP EMV BANCARIO REALISTA SUPREMO */
        .chip-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: flex-start;
        }

        .emv-chip {
            width: 50px;
            height: 38px;
            background: linear-gradient(135deg, #fef2cc 0%, #dfb15b 45%, #996515 100%);
            border-radius: 5px;
            position: relative;
            box-shadow: inset 0 1px 3px rgba(255,255,255,0.8), 0 5px 10px rgba(0,0,0,0.6);
            overflow: hidden;
            border: 0.5px solid #b8860b;
        }

        /* Patrón de circuitos de oro grabados en el chip */
        .emv-chip::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(90deg, transparent 33%, rgba(0,0,0,0.3) 33%, rgba(0,0,0,0.3) 36%, transparent 36%),
                linear-gradient(90deg, transparent 66%, rgba(0,0,0,0.3) 66%, rgba(0,0,0,0.3) 69%, transparent 69%),
                linear-gradient(0deg, transparent 48%, rgba(0,0,0,0.3) 48%, rgba(0,0,0,0.3) 52%, transparent 52%);
        }

        .emv-chip::after {
            content: "";
            position: absolute;
            top: 25%; left: 15%; right: 15%; bottom: 25%;
            border: 1px solid rgba(0,0,0,0.35);
            border-radius: 2px;
        }

        .contactless-waves {
            color: var(--gold-primary);
            font-size: 1.2rem;
            letter-spacing: -2px;
            opacity: 0.85;
            transform: rotate(90deg);
        }

        /* Marco QR Corporativo */
        .qr-frame {
            background: #ffffff;
            padding: 5px;
            border-radius: 4px;
            display: inline-block;
            box-shadow: 0 6px 18px rgba(0,0,0,0.8);
            width: 84px;
            height: 84px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qr-frame img {
            display: block;
            width: 74px !important;
            height: 74px !important;
        }

        .card-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .card-title-main {
            color: var(--text-main);
            font-size: 1.15rem;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* ==========================================
           BOTONES DE ACCIÓN (Grid Profesional)
           ========================================== */
        .actions-grid {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn {
            background: transparent;
            color: var(--gold-primary);
            border: 1px solid var(--gold-primary);
            padding: 11px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.72rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            text-align: center;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn:hover {
            background: var(--gold-primary);
            color: var(--bg-color);
            box-shadow: 0 0 15px rgba(223, 177, 91, 0.4);
        }

        .btn-full {
            grid-column: span 2;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background: var(--card-dark);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid var(--gold-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            max-width: 90%;
        }

        .close-modal {
            position: absolute;
            top: 15px; right: 20px;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }
        .close-modal:hover { color: var(--text-main); }
    </style>
</head>
<body>

    <header>
        <h1>linkea.fy</h1>
        <p>Corporate Card Management • Black Gold Edition</p>
    </header>

    <div class="container" id="tarjetas-container">
        <!-- Contenido dinámico -->
    </div>

    <!-- Modal para ver tarjeta ampliada -->
    <div class="modal" id="cardModal">
        <div class="modal-content">
            <span class="close-modal" onclick="cerrarModal()">&times;</span>
            <h3 style="color: var(--gold-primary); margin-bottom: 25px; font-weight: 400; letter-spacing: 2px;" id="modalTitle">Vista Previa</h3>
            <div id="modalCardContainer"></div>
        </div>
    </div>

    <script>
        const BASE_URL = window.location.origin + window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/')) + '/';

        async function cargarTarjetas() {
            try {
                const response = await fetch(`tarjetas.json?_=${new Date().getTime()}`);
                if (!response.ok) throw new Error('No se pudo cargar tarjetas.json');
                
                const tarjetas = await response.json();
                const container = document.getElementById('tarjetas-container');
                container.innerHTML = '';

                tarjetas.forEach(tarjeta => {
                    const urlPermanente = `${BASE_URL}t/${tarjeta.id}/`;
                    const cardIdUnico = `card-${tarjeta.id}`;
                    const qrIdUnico = `qr-${tarjeta.id}`;

                    const cardHTML = `
                        <div class="card-box">
                            <div class="card-meta">
                                <h3>ID: ${tarjeta.id} - ${tarjeta.nombre}</h3>
                                <span class="badge badge-${tarjeta.estado}">${tarjeta.estado}</span>
                            </div>

                            <!-- Tarjeta Física Suprema Black Gold (Minimalista & Bancaria) -->
                            <div class="physical-card" id="${cardIdUnico}">
                                <div class="card-top">
                                    <div class="brand-logo">linkea.fy</div>
                                </div>
                                <div class="card-middle">
                                    <div class="chip-container">
                                        <div class="emv-chip"></div>
                                        <div class="contactless-waves">&#187;&#187;</div>
                                    </div>
                                    <div class="qr-frame" id="${qrIdUnico}"></div>
                                </div>
                                <div class="card-bottom">
                                    <div class="card-title-main">Black Gold</div>
                                </div>
                            </div>

                            <!-- Opciones individuales -->
                            <div class="actions-grid">
                                <button class="btn" onclick="verTarjeta('${cardIdUnico}', 'Tarjeta ID: ${tarjeta.id}')">Ver Tarjeta</button>
                                <button class="btn" onclick="descargarQR('${qrIdUnico}', '${tarjeta.id}')">Descargar QR</button>
                                <button class="btn btn-full" onclick="descargarFoto('${cardIdUnico}', '${tarjeta.id}')">Descargar Tarjeta a Fotos</button>
                                <button class="btn btn-full" onclick="descargarPDF('${cardIdUnico}', 'Tarjeta-${tarjeta.id}')">Imprimir / Guardar PDF</button>
                            </div>
                        </div>
                    `;

                    container.innerHTML += cardHTML;

                    // Generación segura del QR con contenedor temporal
                    const tempDiv = document.createElement("div");
                    new QRCode(tempDiv, {
                        text: urlPermanente,
                        width: 74,
                        height: 74,
                        colorDark: "#000000",
                        colorLight: "#ffffff",
                        correctLevel: QRCode.CorrectLevel.H
                    });

                    setTimeout(() => {
                        const qrImg = tempDiv.querySelector("img") || tempDiv.querySelector("canvas");
                        const destinoQR = document.getElementById(qrIdUnico);
                        if (destinoQR && qrImg) {
                            destinoQR.innerHTML = "";
                            destinoQR.appendChild(qrImg);
                        }
                    }, 50);
                });

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('tarjetas-container').innerHTML = `
                    <p style="color: #e74c3c; text-align: center; grid-column: 1/-1;">
                        Error al cargar las tarjetas. Verifica que <strong>tarjetas.json</strong> esté en la raíz.
                    </p>`;
            }
        }

        // 1. Ver Tarjeta en Modal
        function verTarjeta(cardId, nombre) {
            const original = document.getElementById(cardId);
            const clone = original.cloneNode(true);
            document.getElementById('modalCardContainer').innerHTML = '';
            document.getElementById('modalCardContainer').appendChild(clone);
            document.getElementById('modalTitle').innerText = nombre;
            document.getElementById('cardModal').style.display = 'flex';
        }

        function cerrarModal() {
            document.getElementById('cardModal').style.display = 'none';
        }

        // 2. Descargar SOLO EL QR de forma inteligente (Compatible con iPhone y Android)
        function descargarQR(qrContainerId, idTarjeta) {
            const qrContainer = document.getElementById(qrContainerId);
            const qrImg = qrContainer.querySelector("img") || qrContainer.querySelector("canvas");

            if (!qrImg) {
                alert("El código QR aún se está generando. Intenta en un segundo.");
                return;
            }

            // Convertir canvas o imagen de QR a URL de datos de alta calidad
            let imageUrl = qrImg.src;
            if (qrImg.tagName === "CANVAS") {
                imageUrl = qrImg.toDataURL("image/png");
            }

            // Detección estricta de Dispositivo iOS (iPhone / iPad)
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

            if (isIOS) {
                // En iPhone, Safari bloquea la descarga directa automática. Abrimos ventana optimizada para guardar en Fotos.
                const win = window.open("", "_blank");
                win.document.write(`
                    <!DOCTYPE html>
                    <html lang="es">
                    <head>
                        <meta charset="UTF-8">
                        <title>Guardar QR - ID ${idTarjeta}</title>
                        <style>
                            body { background: #080808; color: #fff; font-family: sans-serif; text-align: center; padding: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
                            img { width: 220px; height: 220px; border-radius: 8px; border: 3px solid #dfb15b; background: #fff; padding: 10px; margin-bottom: 20px; }
                            p { color: #dfb15b; font-size: 1.1rem; line-height: 1.5; max-width: 300px; }
                        </style>
                    </head>
                    <body>
                        <img src="${imageUrl}" alt="Código QR ${idTarjeta}">
                        <p>Mantén presionado el código QR con tu dedo y selecciona <b>"Añadir a Fotos"</b> o <b>"Guardar en Fotos"</b>.</p>
                    </body>
                    </html>
                `);
            } else {
                // Descarga automática directa para Android y Computadora
                const link = document.createElement('a');
                link.download = `qr-linkeafy-${idTarjeta}.png`;
                link.href = imageUrl;
                link.click();
            }
        }

        // 3. Descargar Tarjeta completa a Fotos (con soporte inteligente para iPhone)
        function descargarFoto(cardId, idTarjeta) {
            const elemento = document.getElementById(cardId);
            html2canvas(elemento, { 
                scale: 4, 
                backgroundColor: null,
                useCORS: true
            }).then(canvas => {
                const imageUrl = canvas.toDataURL('image/png', 1.0);
                const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

                if (isIOS) {
                    const win = window.open("", "_blank");
                    win.document.write(`
                        <!DOCTYPE html>
                        <html lang="es">
                        <head>
                            <meta charset="UTF-8">
                            <title>Guardar Tarjeta - ID ${idTarjeta}</title>
                            <style>
                                body { background: #080808; color: #fff; font-family: sans-serif; text-align: center; padding: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
                                img { width: 100%; max-width: 350px; border-radius: 8px; border: 2px solid #dfb15b; margin-bottom: 20px; }
                                p { color: #dfb15b; font-size: 1rem; line-height: 1.5; max-width: 320px; }
                            </style>
                        </head>
                        <body>
                            <img src="${imageUrl}" alt="Tarjeta ${idTarjeta}">
                            <p>Mantén presionada la tarjeta con tu dedo y selecciona <b>"Añadir a Fotos"</b>.</p>
                        </body>
                        </html>
                    `);
                } else {
                    const link = document.createElement('a');
                    link.download = `tarjeta-${idTarjeta}-linkeafy-hd.png`;
                    link.href = imageUrl;
                    link.click();
                }
            });
        }

        // 4. Imprimir / Guardar PDF profesional a 8.5 x 5 cm
        function descargarPDF(cardId, nombre) {
            const elemento = document.getElementById(cardId).outerHTML;
            const ventanaPrint = window.open('', '_blank', 'width=900,height=700');
            ventanaPrint.document.write(`
                <!DOCTYPE html>
                <html lang="es">
                <head>
                    <meta charset="UTF-8">
                    <title>Imprimir ${nombre}</title>
                    <style>
                        body { background: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
                        .physical-card {
                            width: 85mm;
                            height: 50mm;
                            background: radial-gradient(circle at 70% 20%, #1a1a1a 0%, #080808 70%, #020202 100%) !important;
                            border: 1.5px solid #dfb15b;
                            border-radius: 10px;
                            padding: 30px;
                            display: flex;
                            flex-direction: column;
                            justify-content: space-between;
                            position: relative;
                            -webkit-print-color-adjust: exact;
                            print-color-adjust: exact;
                        }
                        .card-top { display: flex; justify-content: space-between; align-items: center; }
                        .brand-logo { color: #dfb15b; font-size: 1.4rem; font-weight: 300; letter-spacing: 3px; font-family: sans-serif; text-transform: lowercase; }
                        .card-middle { display: flex; align-items: center; justify-content: space-between; }
                        .chip-container { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
                        .emv-chip {
                            width: 50px;
                            height: 38px;
                            background: linear-gradient(135deg, #fef2cc 0%, #dfb15b 45%, #996515 100%);
                            border-radius: 5px;
                            position: relative;
                            border: 0.5px solid #b8860b;
                        }
                        .emv-chip::before {
                            content: "";
                            position: absolute;
                            inset: 0;
                            background-image: 
                                linear-gradient(90deg, transparent 33%, rgba(0,0,0,0.3) 33%, rgba(0,0,0,0.3) 36%, transparent 36%),
                                linear-gradient(90deg, transparent 66%, rgba(0,0,0,0.3) 66%, rgba(0,0,0,0.3) 69%, transparent 69%),
                                linear-gradient(0deg, transparent 48%, rgba(0,0,0,0.3) 48%, rgba(0,0,0,0.3) 52%, transparent 52%);
                        }
                        .contactless-icon { color: #dfb15b; font-size: 1.2rem; letter-spacing: -2px; transform: rotate(90deg); }
                        .qr-frame { background: #ffffff; padding: 5px; border-radius: 4px; display: inline-block; width: 84px; height: 84px; display: flex; align-items: center; justify-content: center; }
                        .qr-frame img { display: block; width: 74px !important; height: 74px !important; }
                        .card-bottom { display: flex; justify-content: space-between; align-items: flex-end; }
                        .card-title-main { color: #ffffff; font-size: 1.15rem; font-weight: 500; letter-spacing: 3px; font-family: sans-serif; text-transform: uppercase; }
                    </style>
                </head>
                <body>
                    ${elemento}
                    <script>
                        window.onload = function() { window.print(); window.close(); }
                    <\/script>
                </body>
                </html>
            `);
            ventanaPrint.document.close();
        }

        document.addEventListener('DOMContentLoaded', cargarTarjetas);
    </script>
</body>
</html>
