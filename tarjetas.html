<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | linkea.fy</title>
    <!-- Librerías para QRs y exportación HD -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #080808;
            --card-dark: #111111;
            --gold: #dfb15b;
            --gold-light: #f5e6ca;
            --text-main: #ffffff;
            --text-muted: #888888;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 30px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            color: var(--gold);
            font-size: 2.2rem;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 8px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 35px;
        }

        .card-box {
            background: var(--card-dark);
            border: 1px solid #222;
            border-radius: 14px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .card-meta {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .card-meta h3 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .badge {
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .badge-activa { background: rgba(40, 167, 69, 0.15); color: #2ecc71; border: 1px solid rgba(46, 204, 113, 0.3); }
        .badge-inactiva { background: rgba(231, 76, 60, 0.15); color: #e74c3c; border: 1px solid rgba(231, 76, 60, 0.3); }

        /* ==========================================================
           DISEÑO SUPREMO BLACK GOLD (8.5 x 5 cm - Estilo Bancario)
           ========================================================== */
        .physical-card {
            width: 390px;
            height: 230px;
            background: linear-gradient(135deg, #121212 0%, #040404 100%);
            border: 1.5px solid var(--gold);
            border-radius: 0px; /* Esquinas cuadradas de alta gama */
            padding: 26px 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            box-shadow: 0 12px 35px rgba(223, 177, 91, 0.2);
            margin-bottom: 22px;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            color: var(--gold);
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .card-middle {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Chip Bancario Profesional con Efecto Realista 3D Gold */
        .nfc-chip-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: flex-start;
        }

        .bank-chip {
            width: 42px;
            height: 32px;
            background: linear-gradient(135deg, #f9f1df 0%, #dfb15b 40%, #996515 100%);
            border-radius: 5px;
            position: relative;
            box-shadow: inset 0 1px 3px rgba(255,255,255,0.6), 0 3px 6px rgba(0,0,0,0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Líneas de contacto del chip de banco */
        .bank-chip::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(90deg, transparent 45%, rgba(0,0,0,0.3) 45%, rgba(0,0,0,0.3) 55%, transparent 55%),
                linear-gradient(0deg, transparent 45%, rgba(0,0,0,0.3) 45%, rgba(0,0,0,0.3) 55%, transparent 55%);
        }

        .bank-chip::after {
            content: "";
            position: absolute;
            width: 60%;
            height: 60%;
            border: 1px solid rgba(0,0,0,0.35);
            border-radius: 2px;
        }

        .contactless-waves {
            color: var(--gold);
            font-size: 1.2rem;
            letter-spacing: -2px;
            opacity: 0.9;
        }

        /* Contenedor QR de alto contraste */
        .qr-frame {
            background: #ffffff;
            padding: 6px;
            border-radius: 4px;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .qr-frame canvas, .qr-frame img {
            display: block;
            width: 76px !important;
            height: 76px !important;
        }

        .card-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .card-titles-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .card-title-main {
            color: var(--text-main);
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .card-title-sub {
            color: var(--gold);
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* ==========================================
           BOTONES DE ACCIÓN
           ========================================== */
        .actions-grid {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn {
            background: transparent;
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.78rem;
            text-transform: uppercase;
            transition: all 0.25s ease;
            text-align: center;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn:hover {
            background: var(--gold);
            color: var(--bg-color);
        }

        .btn-full {
            grid-column: span 2;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.88);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background: var(--card-dark);
            padding: 35px;
            border-radius: 16px;
            border: 1px solid var(--gold);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            max-width: 90%;
        }

        .close-modal {
            position: absolute;
            top: 15px; right: 20px;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }
        .close-modal:hover { color: var(--text-main); }
    </style>
</head>
<body>

    <header>
        <h1>linkea.fy</h1>
        <p>Panel de Control • Tarjetas Black Gold HD (8.5 x 5 cm)</p>
    </header>

    <div class="container" id="tarjetas-container">
        <!-- Contenido dinámico -->
    </div>

    <!-- Modal para ver tarjeta ampliada -->
    <div class="modal" id="cardModal">
        <div class="modal-content">
            <span class="close-modal" onclick="cerrarModal()">&times;</span>
            <h3 style="color: var(--gold); margin-bottom: 20px;" id="modalTitle">Vista Previa</h3>
            <div id="modalCardContainer"></div>
        </div>
    </div>

    <script>
        const BASE_URL = window.location.origin + window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/')) + '/';

        async function cargarTarjetas() {
            try {
                const response = await fetch(`tarjetas.json?_=${new Date().getTime()}`);
                if (!response.ok) throw new Error('No se pudo cargar tarjetas.json');
                
                const tarjetas = await response.json();
                const container = document.getElementById('tarjetas-container');
                container.innerHTML = '';

                tarjetas.forEach(tarjeta => {
                    const urlPermanente = `${BASE_URL}t/${tarjeta.id}/`;
                    const cardIdUnico = `card-${tarjeta.id}`;
                    const qrIdUnico = `qr-${tarjeta.id}`;

                    const cardHTML = `
                        <div class="card-box">
                            <div class="card-meta">
                                <h3>${tarjeta.nombre}</h3>
                                <span class="badge badge-${tarjeta.estado}">${tarjeta.estado}</span>
                            </div>

                            <!-- Tarjeta Física Suprema Black Gold HD -->
                            <div class="physical-card" id="${cardIdUnico}">
                                <div class="card-top">
                                    <div class="brand-logo">linkea.fy</div>
                                </div>
                                <div class="card-middle">
                                    <div class="nfc-chip-container">
                                        <div class="bank-chip"></div>
                                        <div class="contactless-waves">&#187;&#187;</div>
                                    </div>
                                    <div class="qr-frame" id="${qrIdUnico}"></div>
                                </div>
                                <div class="card-bottom">
                                    <div class="card-titles-group">
                                        <div class="card-title-main">${tarjeta.nombre}</div>
                                        <div class="card-title-sub">Black Gold</div>
                                    </div>
                                </div>
                            </div>

                            <!-- Opciones individuales -->
                            <div class="actions-grid">
                                <button class="btn" onclick="verTarjeta('${cardIdUnico}', '${tarjeta.nombre}')">Ver Tarjeta</button>
                                <button class="btn" onclick="descargarFoto('${cardIdUnico}', '${tarjeta.id}')">Descargar a Fotos</button>
                                <button class="btn btn-full" onclick="descargarPDF('${cardIdUnico}', '${tarjeta.nombre}')">Imprimir / Guardar PDF</button>
                            </div>
                        </div>
                    `;

                    container.innerHTML += cardHTML;

                    // Generar QR de alto contraste para lectura instantánea
                    new QRCode(document.getElementById(qrIdUnico), {
                        text: urlPermanente,
                        width: 76,
                        height: 76,
                        colorDark: "#000000",
                        colorLight: "#ffffff",
                        correctLevel: QRCode.CorrectLevel.H
                    });
                });

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('tarjetas-container').innerHTML = `
                    <p style="color: #e74c3c; text-align: center; grid-column: 1/-1;">
                        Error al cargar las tarjetas. Verifica que <strong>tarjetas.json</strong> esté en la raíz.
                    </p>`;
            }
        }

        // 1. Ver Tarjeta en Modal
        function verTarjeta(cardId, nombre) {
            const original = document.getElementById(cardId);
            const clone = original.cloneNode(true);
            document.getElementById('modalCardContainer').innerHTML = '';
            document.getElementById('modalCardContainer').appendChild(clone);
            document.getElementById('modalTitle').innerText = nombre;
            document.getElementById('cardModal').style.display = 'flex';
        }

        function cerrarModal() {
            document.getElementById('cardModal').style.display = 'none';
        }

        // 2. Descargar a Fotos en Full HD real (escala 4x)
        function descargarFoto(cardId, idTarjeta) {
            const elemento = document.getElementById(cardId);
            html2canvas(elemento, { 
                scale: 4, 
                backgroundColor: null,
                useCORS: true
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `tarjeta-${idTarjeta}-linkeafy-hd.png`;
                link.href = canvas.toDataURL('image/png', 1.0);
                link.click();
            });
        }

        // 3. Imprimir / Guardar PDF profesional a 8.5 x 5 cm con esquinas cuadradas
        function descargarPDF(cardId, nombre) {
            const elemento = document.getElementById(cardId).outerHTML;
            const ventanaPrint = window.open('', '_blank', 'width=900,height=700');
            ventanaPrint.document.write(`
                <!DOCTYPE html>
                <html lang="es">
                <head>
                    <meta charset="UTF-8">
                    <title>Imprimir Tarjeta - ${nombre}</title>
                    <style>
                        body { background: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
                        .physical-card {
                            width: 85mm;
                            height: 50mm;
                            background: linear-gradient(135deg, #121212 0%, #040404 100%) !important;
                            border: 1.5px solid #dfb15b;
                            border-radius: 0px;
                            padding: 26px 30px;
                            display: flex;
                            flex-direction: column;
                            justify-content: space-between;
                            position: relative;
                            -webkit-print-color-adjust: exact;
                            print-color-adjust: exact;
                        }
                        .card-top { display: flex; justify-content: space-between; align-items: center; }
                        .brand-logo { color: #dfb15b; font-size: 1.5rem; font-weight: 700; letter-spacing: 2px; font-family: sans-serif; }
                        .card-middle { display: flex; align-items: center; justify-content: space-between; }
                        .nfc-chip-container { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
                        .bank-chip {
                            width: 42px;
                            height: 32px;
                            background: linear-gradient(135deg, #f9f1df 0%, #dfb15b 40%, #996515 100%);
                            border-radius: 5px;
                            position: relative;
                            display: flex;
                            justify-content: center;
                            align-items: center;
                        }
                        .bank-chip::before {
                            content: "";
                            position: absolute;
                            width: 100%;
                            height: 100%;
                            background: 
                                linear-gradient(90deg, transparent 45%, rgba(0,0,0,0.3) 45%, rgba(0,0,0,0.3) 55%, transparent 55%),
                                linear-gradient(0deg, transparent 45%, rgba(0,0,0,0.3) 45%, rgba(0,0,0,0.3) 55%, transparent 55%);
                        }
                        .bank-chip::after {
                            content: "";
                            position: absolute;
                            width: 60%;
                            height: 60%;
                            border: 1px solid rgba(0,0,0,0.35);
                            border-radius: 2px;
                        }
                        .contactless-waves { color: #dfb15b; font-size: 1.2rem; letter-spacing: -2px; }
                        .qr-frame { background: #ffffff; padding: 6px; border-radius: 4px; display: inline-block; }
                        .qr-frame canvas, .qr-frame img { display: block; width: 76px !important; height: 76px !important; }
                        .card-bottom { display: flex; justify-content: space-between; align-items: flex-end; }
                        .card-titles-group { display: flex; flex-direction: column; gap: 2px; }
                        .card-title-main { color: #ffffff; font-size: 1.2rem; font-weight: 600; font-family: sans-serif; }
                        .card-title-sub { color: #dfb15b; font-size: 0.75rem; font-weight: 500; letter-spacing: 1.5px; font-family: sans-serif; text-transform: uppercase; }
                    </style>
                </head>
                <body>
                    ${elemento}
                    <script>
                        window.onload = function() { window.print(); window.close(); }
                    <\/script>
                </body>
                </html>
            `);
            ventanaPrint.document.close();
        }

        document.addEventListener('DOMContentLoaded', cargarTarjetas);
    </script>
</body>
</html>
