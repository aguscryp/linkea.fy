<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | Alertix - linkea.fy</title>
    <!-- Librerías para QR y captura de imagen -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-dark: #050507;
            --panel-bg: #0b0b0d;
            --card-metal: linear-gradient(135deg, #18181c 0%, #0d0d0f 35%, #1a1a1e 70%, #050507 100%);
            --alert-red: #ff1e38;
            --alert-glow: rgba(255, 30, 56, 0.4);
            --border-red: rgba(255, 30, 56, 0.35);
            --text-main: #ffffff;
            --text-muted: #888888;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 40px 20px;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: var(--alert-red);
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 4px;
            text-shadow: 0 0 20px var(--alert-glow);
            margin-bottom: 6px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.8rem;
            letter-spacing: 2.5px;
            text-transform: uppercase;
        }

        .cards-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 30px;
        }

        .panel-card-box {
            background: #0f0f12;
            border: 1px solid rgba(255, 30, 56, 0.2);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            transition: border-color 0.3s ease;
        }

        .panel-card-box:hover {
            border-color: var(--alert-red);
        }

        .card-header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title-id {
            font-size: 0.9rem;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .badge-status {
            background: rgba(46, 213, 115, 0.12);
            color: #2ed573;
            border: 1px solid rgba(46, 213, 115, 0.3);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .badge-status.stock {
            background: rgba(255, 171, 0, 0.12);
            color: #ffab00;
            border-color: rgba(255, 171, 0, 0.3);
        }

        .alertix-card-preview {
            width: 100%;
            height: 200px;
            background: var(--card-metal);
            border: 1px solid var(--border-red);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 14px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.95), inset 0 1px 2px rgba(255, 255, 255, 0.15);
            position: relative;
            overflow: hidden;
            margin: 5px 0;
        }

        .alertix-card-preview::before {
            content: '';
            position: absolute;
            top: -60%; left: -60%; width: 220%; height: 220%;
            background: linear-gradient(
                115deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.02) 40%,
                rgba(255, 30, 56, 0.25) 50%,
                rgba(255, 255, 255, 0.02) 60%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: rotate(25deg);
            pointer-events: none;
        }

        .card-brand-text {
            color: var(--alert-red);
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-shadow: 0 0 15px var(--alert-glow);
            z-index: 2;
        }

        .qr-wrapper {
            background: #ffffff;
            padding: 6px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qr-wrapper img, .qr-wrapper canvas {
            display: block;
            width: 75px !important;
            height: 75px !important;
        }

        .btn-row {
            display: flex;
            gap: 10px;
        }

        .btn-panel {
            background: transparent;
            border: 1px solid var(--border-red);
            color: var(--text-main);
            padding: 11px;
            border-radius: 6px;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-decoration: none;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .btn-panel:hover {
            background: var(--alert-red);
            color: #ffffff;
            box-shadow: 0 0 15px var(--alert-glow);
        }

        @media print {
            body { background: #fff; padding: 0; }
            .header, .btn-row, .btn-panel { display: none !important; }
            .cards-grid { display: block; }
            .panel-card-box { break-inside: avoid; page-break-inside: avoid; border: none; box-shadow: none; margin-bottom: 20px; }
            .alertix-card-preview { border: 1px solid #000; box-shadow: none; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>LINK EA.FY</h1>
        <p>PANEL DE CONTROL • ALERTIX</p>
    </div>

    <div class="cards-grid" id="cardsGrid">
        <!-- Se generan dinámicamente según tarjetas.json -->
    </div>

    <script>
        async function cargarPanelAlertix() {
            const grid = document.getElementById('cardsGrid');
            try {
                const response = await fetch('tarjetas.json?_=' + new Date().getTime());
                if (!response.ok) throw new Error("No se pudo cargar el archivo tarjetas.json");

                const tarjetas = await response.json();
                grid.innerHTML = '';

                tarjetas.forEach((t, index) => {
                    // Ruta exacta considerando tu repositorio GitHub (linkea.fy)
                    const urlTarjeta = `${window.location.origin}/linkea.fy/alertix/tt/${t.id}/index.html`;

                    const cardHTML = `
                        <div class="panel-card-box">
                            <div class="card-header-info">
                                <span class="card-title-id">ID: ${t.id} - Alertix</span>
                                <span class="badge-status ${t.estado}">${t.estado}</span>
                            </div>

                            <!-- VISTA PREVIA DE LA TARJETA ALERTIX -->
                            <div class="alertix-card-preview" id="card-preview-${index}">
                                <div class="card-brand-text">ALERTIX</div>
                                <div class="qr-wrapper" id="qr-box-${index}"></div>
                            </div>

                            <!-- BOTONES DE ACCIÓN -->
                            <div class="btn-row">
                                <a href="tt/${t.id}/index.html" target="_blank" class="btn-panel">VER TARJETA</a>
                                <button onclick="descargarQR('qr-box-${index}', '${t.id}')" class="btn-panel">DESCARGAR QR</button>
                            </div>

                            <button onclick="descargarTarjetaImg('card-preview-${index}', '${t.id}')" class="btn-panel">DESCARGAR TARJETA A FOTOS</button>
                            <button onclick="window.print()" class="btn-panel">IMPRIMIR / GUARDAR PDF</button>
                        </div>
                    `;
                    grid.innerHTML += cardHTML;

                    // Generar código QR apuntando correctamente al repositorio
                    setTimeout(() => {
                        new QRCode(document.getElementById(`qr-box-${index}`), {
                            text: urlTarjeta,
                            width: 75,
                            height: 75,
                            colorDark: "#000000",
                            colorLight: "#ffffff",
                            correctLevel: QRCode.CorrectLevel.H
                        });
                    }, 50);
                });

            } catch (error) {
                console.error(error);
                grid.innerHTML = `<p style="color: var(--alert-red); text-align: center; grid-column: 1/-1;">Error al cargar las tarjetas de Alertix.</p>`;
            }
        }

        // Descargar sólo el código QR
        function descargarQR(containerId, id) {
            const container = document.getElementById(containerId);
            const img = container.querySelector('img');
            const canvas = container.querySelector('canvas');

            let imageSrc = "";
            if (img && img.src) {
                imageSrc = img.src;
            } else if (canvas) {
                imageSrc = canvas.toDataURL("image/png");
            }

            if (imageSrc) {
                const link = document.createElement('a');
                link.download = `QR_Alertix_${id}.png`;
                link.href = imageSrc;
                link.click();
            } else {
                alert("No se pudo generar la imagen del QR.");
            }
        }

        // Descargar la tarjeta completa como PNG
        function descargarTarjetaImg(cardId, id) {
            const cardElement = document.getElementById(cardId);
            
            html2canvas(cardElement, {
                scale: 3,
                backgroundColor: null,
                useCORS: true
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Tarjeta_Alertix_${id}.png`;
                link.href = canvas.toDataURL("image/png");
                link.click();
            });
        }

        cargarPanelAlertix();
    </script>
</body>
</html>
