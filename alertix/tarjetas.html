<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | Alertix - linkea.fy</title>
    <!-- Librerías para QR y captura de imagen en alta resolución -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-dark: #050507;
            --panel-bg: #0b0b0d;
            /* Fondo negro metalizado puro idéntico a Black Gold */
            --card-metal: #121215;
            --alert-red: #ff1e38;
            --alert-glow: rgba(255, 30, 56, 0.4);
            --border-red: rgba(255, 30, 56, 0.35);
            --text-main: #ffffff;
            --text-muted: #888888;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 40px 20px;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: var(--alert-red);
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 4px;
            text-shadow: 0 0 20px var(--alert-glow);
            margin-bottom: 6px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.8rem;
            letter-spacing: 2.5px;
            text-transform: uppercase;
        }

        .cards-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 30px;
        }

        .panel-card-box {
            background: #0f0f12;
            border: 1px solid rgba(255, 30, 56, 0.2);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            transition: border-color 0.3s ease;
        }

        .panel-card-box:hover {
            border-color: var(--alert-red);
        }

        .card-header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title-id {
            font-size: 0.9rem;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .badge-status {
            background: rgba(46, 213, 115, 0.12);
            color: #2ed573;
            border: 1px solid rgba(46, 213, 115, 0.3);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .badge-status.stock {
            background: rgba(255, 171, 0, 0.12);
            color: #ffab00;
            border-color: rgba(255, 171, 0, 0.3);
        }

        /* TARJETA FÍSICA ALERTIX (Negro metalizado puro) */
        .alertix-card-preview {
            width: 100%;
            height: 200px;
            background: var(--card-metal);
            border: 1px solid var(--border-red);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 14px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.95), inset 0 1px 3px rgba(255, 255, 255, 0.08);
            position: relative;
            overflow: hidden;
            margin: 5px 0;
        }

        .card-brand-text {
            color: var(--alert-red);
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-shadow: 0 0 15px var(--alert-glow);
            z-index: 2;
        }

        .qr-wrapper {
            background: #ffffff;
            padding: 6px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qr-wrapper img, .qr-wrapper canvas {
            display: block;
            width: 75px !important;
            height: 75px !important;
        }

        .btn-row {
            display: flex;
            gap: 10px;
        }

        .btn-panel {
            background: transparent;
            border: 1px solid var(--border-red);
            color: var(--text-main);
            padding: 11px;
            border-radius: 6px;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-decoration: none;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .btn-panel:hover {
            background: var(--alert-red);
            color: #ffffff;
            box-shadow: 0 0 15px var(--alert-glow);
        }

        /* ==========================================
           VENTANA MODAL ZOOM (ESTILO BLACK GOLD)
           ========================================== */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: #0d0d10;
            border: 1px solid var(--border-red);
            border-radius: 20px;
            padding: 35px 30px;
            width: 90%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            box-shadow: 0 25px 60px rgba(0,0,0,0.9), 0 0 30px rgba(255, 30, 56, 0.2);
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-close {
            position: absolute;
            top: 15px; right: 20px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.4rem;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .modal-close:hover {
            color: var(--alert-red);
        }

        .modal-title {
            color: var(--alert-red);
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 2px;
            margin-bottom: 25px;
            text-align: center;
        }

        .modal-card-zoomed {
            width: 100%;
            height: 250px;
            background: var(--card-metal);
            border: 1px solid var(--border-red);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 18px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.95), inset 0 1px 3px rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .modal-brand {
            color: var(--alert-red);
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 4px;
            text-shadow: 0 0 20px var(--alert-glow);
            z-index: 2;
        }

        .modal-qr-box {
            background: #ffffff;
            padding: 8px;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.8);
            z-index: 2;
        }

        .modal-qr-box img, .modal-qr-box canvas {
            display: block;
            width: 110px !important;
            height: 110px !important;
        }

        /* ==========================================
           CONFIGURACIÓN DE IMPRESIÓN EXCLUSIVA
           ========================================== */
        @media print {
            body * {
                visibility: hidden;
            }
            body {
                background: #ffffff !important;
            }
            /* Solo muestra la tarjeta seleccionada para imprimir perfectamente centrada */
            #printContainer, #printContainer * {
                visibility: visible;
            }
            #printContainer {
                position: absolute;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%);
                width: 8.5cm;
                height: 5cm;
                border: 1px solid #333 !important;
                background: #121215 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>LINK EA.FY</h1>
        <p>PANEL DE CONTROL • ALERTIX</p>
    </div>

    <div class="cards-grid" id="cardsGrid">
        <!-- Se generan dinámicamente -->
    </div>

    <!-- CONTENEDOR OCULTO PARA IMPRESIÓN LIMPIA DE UNA SOLA TARJETA -->
    <div id="printContainer" style="display:none;"></div>

    <!-- VENTANA MODAL ZOOM -->
    <div class="modal-overlay" id="cardModal" onclick="cerrarModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="cerrarModalDirecto()">&times;</button>
            <div class="modal-title" id="modalTitleId">Tarjeta ID: A-0001</div>
            <div class="modal-card-zoomed" id="modalCardPreview">
                <div class="modal-brand">ALERTIX</div>
                <div class="modal-qr-box" id="modalQrContainer"></div>
            </div>
        </div>
    </div>

    <script>
        async function cargarPanelAlertix() {
            const grid = document.getElementById('cardsGrid');
            try {
                const response = await fetch('tarjetas.json?_=' + new Date().getTime());
                if (!response.ok) throw new Error("No se pudo cargar el archivo tarjetas.json");

                const tarjetas = await response.json();
                grid.innerHTML = '';

                tarjetas.forEach((t, index) => {
                    const urlTarjeta = `${window.location.origin}/linkea.fy/alertix/tt/${t.id}/index.html`;

                    const cardHTML = `
                        <div class="panel-card-box">
                            <div class="card-header-info">
                                <span class="card-title-id">ID: ${t.id} - Alertix</span>
                                <span class="badge-status ${t.estado}">${t.estado}</span>
                            </div>

                            <!-- VISTA PREVIA DE LA TARJETA -->
                            <div class="alertix-card-preview" id="card-preview-${index}">
                                <div class="card-brand-text">ALERTIX</div>
                                <div class="qr-wrapper" id="qr-box-${index}"></div>
                            </div>

                            <!-- BOTONES DE ACCIÓN -->
                            <div class="btn-row">
                                <button onclick="abrirModalZoom('${t.id}', '${urlTarjeta}')" class="btn-panel">VER TARJETA</button>
                                <button onclick="descargarQR('qr-box-${index}', '${t.id}')" class="btn-panel">DESCARGAR QR</button>
                            </div>

                            <button onclick="descargarTarjetaImg('card-preview-${index}', '${t.id}')" class="btn-panel">DESCARGAR TARJETA A FOTOS</button>
                            <button onclick="imprimirTarjetaIndividual('${t.id}', '${urlTarjeta}')" class="btn-panel">IMPRIMIR / GUARDAR PDF</button>
                        </div>
                    `;
                    grid.innerHTML += cardHTML;

                    // Generar QR en la tarjeta del panel
                    setTimeout(() => {
                        new QRCode(document.getElementById(`qr-box-${index}`), {
                            text: urlTarjeta,
                            width: 75,
                            height: 75,
                            colorDark: "#000000",
                            colorLight: "#ffffff",
                            correctLevel: QRCode.CorrectLevel.H
                        });
                    }, 50);
                });

            } catch (error) {
                console.error(error);
                grid.innerHTML = `<p style="color: var(--alert-red); text-align: center; grid-column: 1/-1;">Error al cargar las tarjetas de Alertix.</p>`;
            }
        }

        // FUNCIONES DEL MODAL ZOOM
        function abrirModalZoom(id, url) {
            document.getElementById('modalTitleId').innerText = `Tarjeta ID: ${id}`;
            const qrContainer = document.getElementById('modalQrContainer');
            qrContainer.innerHTML = '';

            new QRCode(qrContainer, {
                text: url,
                width: 110,
                height: 110,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });

            document.getElementById('cardModal').classList.add('active');
        }

        function cerrarModalDirecto() {
            document.getElementById('cardModal').classList.remove('active');
        }

        function cerrarModal(event) {
            if (event.target.id === 'cardModal') {
                cerrarModalDirecto();
            }
        }

        // Descargar QR individual en alta calidad
        function descargarQR(containerId, id) {
            const container = document.getElementById(containerId);
            const img = container.querySelector('img');
            const canvas = container.querySelector('canvas');
            let imageSrc = img && img.src ? img.src : (canvas ? canvas.toDataURL("image/png") : "");

            if (imageSrc) {
                const link = document.createElement('a');
                link.download = `QR_Alertix_${id}.png`;
                link.href = imageSrc;
                link.click();
            } else {
                alert("No se pudo generar la imagen del QR.");
            }
        }

        // Descargar tarjeta completa en ultra alta resolución (evita bordes pixelados)
        function descargarTarjetaImg(cardId, id) {
            const cardElement = document.getElementById(cardId);
            html2canvas(cardElement, {
                scale: 4, // Escala cuádruple para máxima nitidez y cero bordes feos
                backgroundColor: "#121215",
                useCORS: true
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Tarjeta_Alertix_${id}.png`;
                link.href = canvas.toDataURL("image/png", 1.0);
                link.click();
            });
        }

        // Imprimir únicamente la tarjeta seleccionada de forma limpia
        function imprimirTarjetaIndividual(id, url) {
            const printBox = document.getElementById('printContainer');
            printBox.style.display = 'block';
            printBox.innerHTML = `
                <div style="width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 12px; background: #121215;">
                    <div style="color: #ff1e38; font-size: 1.6rem; font-weight: 700; letter-spacing: 3px;">ALERTIX</div>
                    <div id="printQr-${id}" style="background: #fff; padding: 4px; border-radius: 6px;"></div>
                </div>
            `;

            new QRCode(document.getElementById(`printQr-${id}`), {
                text: url,
                width: 70,
                height: 70,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });

            setTimeout(() => {
                window.print();
                printBox.style.display = 'none';
            }, 300);
        }

        cargarPanelAlertix();
    </script>
</body>
</html>
