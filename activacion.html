<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espacio Disponible | linkea.fy</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #050507;
            --gold-primary: #dfb15b;
            --gold-glow: rgba(223, 177, 91, 0.3);
            --text-main: #ffffff;
            --text-muted: #88888c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #18181c 0%, #0d0d0f 35%, #1a1a1e 70%, #050507 100%);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        /* Aura de luz sutil de fondo */
        .bg-glow {
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, var(--gold-glow) 0%, rgba(0,0,0,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            filter: blur(40px);
            pointer-events: none;
            animation: pulseGlow 4s infinite ease-in-out;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.4; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.1); }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 400px;
            width: 100%;
            background: #0e0e11;
            border: 1px solid rgba(223, 177, 91, 0.25);
            border-radius: 16px;
            padding: 35px 25px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.9), 0 0 20px rgba(223, 177, 91, 0.1);
            animation: fadeInUp 0.8s ease-out;
        }

        .brand-logo {
            color: var(--gold-primary);
            font-size: 2.4rem;
            font-weight: 400;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .card-id-badge {
            display: inline-block;
            background: rgba(223, 177, 91, 0.1);
            color: var(--gold-primary);
            border: 1px solid rgba(223, 177, 91, 0.3);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .status-icon {
            font-size: 2.8rem;
            color: var(--gold-primary);
            margin-bottom: 20px;
            animation: floatIcon 3s infinite ease-in-out;
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        h1 {
            font-size: 1.2rem;
            font-weight: 500;
            letter-spacing: 1px;
            margin-bottom: 12px;
            color: var(--text-main);
        }

        p {
            color: var(--text-muted);
            font-size: 0.85rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn-claim {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: linear-gradient(135deg, #dfb15b 0%, #b88d3e 100%);
            color: #000000;
            text-decoration: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(223, 177, 91, 0.25);
        }

        .btn-claim:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(223, 177, 91, 0.4);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="container">
        <div class="brand-logo">linkea.fy</div>
        <div class="card-id-badge" id="badgeId">Tarjeta en Stock</div>

        <div class="status-icon">
            <i class="fa-solid fa-gem"></i>
        </div>

        <h1>Espacio Exclusivo Disponible</h1>
        <p>Esta tarjeta física <strong>Black Gold</strong> se encuentra activa y a la espera de ser asignada. Conéctala a tu negocio o marca para comenzar a recibir visitas al instante.</p>

        <!-- Botón para contactar o ir a solicitar la activación -->
        <a href="https://wa.me/TU_NUMERO_DE_WHATSAPP?text=Hola,%20quiero%20activar%20la%20tarjeta%20linkea.fy%20con%20el%20ID:%200001" target="_blank" class="btn-claim">
            <i class="fa-brands fa-whatsapp"></i> Adquirir / Activar Espacio
        </a>
    </div>

    <script>
        // Si prefieres que detecte el ID de la carpeta de manera automática
        const pathSegments = window.location.pathname.split('/');
        // Busca el segmento anterior a la barra final o ajusta según tu estructura
        const folderId = pathSegments[pathSegments.length - 2] || pathSegments[pathSegments.length - 1];
        if (folderId && folderId !== "t") {
            document.getElementById('badgeId').innerText = `Tarjeta #${folderId}`;
        }
    </script>
</body>
</html>
