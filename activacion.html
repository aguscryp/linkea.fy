<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espacio Disponible | linkea.fy</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #050507;
            --gold-primary: #dfb15b;
            --gold-glow: rgba(223, 177, 91, 0.3);
            --text-main: #ffffff;
            --text-muted: #88888c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #18181c 0%, #0d0d0f 35%, #1a1a1e 70%, #050507 100%);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
            overflow-x: hidden;
            position: relative;
            perspective: 1000px;
        }

        /* Aura de luz sutil de fondo */
        .bg-glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--gold-glow) 0%, rgba(0,0,0,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            filter: blur(50px);
            pointer-events: none;
            animation: pulseGlow 4s infinite ease-in-out;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.4; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.1); }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 420px;
            width: 100%;
            background: rgba(14, 14, 17, 0.85);
            border: 1px solid rgba(223, 177, 91, 0.25);
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.9), 0 0 25px rgba(223, 177, 91, 0.1);
            backdrop-filter: blur(12px);
            animation: fadeInUp 0.8s ease-out;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .brand-logo {
            color: var(--gold-primary);
            font-size: 2.2rem;
            font-weight: 400;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .card-id-badge {
            display: inline-block;
            background: rgba(223, 177, 91, 0.1);
            color: var(--gold-primary);
            border: 1px solid rgba(223, 177, 91, 0.3);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 20px;
            font-weight: 600;
        }

        /* ==========================================
           CONTENEDOR DE LA TARJETA VIVA 3D
           ========================================== */
        .card-tilt-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
            perspective: 1000px;
            cursor: pointer;
        }

        .physical-card-live {
            width: 340px;
            height: 200px;
            background: linear-gradient(135deg, #18181c 0%, #0d0d0f 35%, #1a1a1e 70%, #050507 100%);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 16px;
            position: relative;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9), inset 0 1px 1px rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(223, 177, 91, 0.3);
            transform-style: preserve-style;
            transition: transform 0.1s ease-out, box-shadow 0.3s ease;
        }

        .physical-card-live:hover {
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.95), 0 0 25px rgba(223, 177, 91, 0.3);
        }

        /* Efecto de reflejo holográfico dinámico sobre la tarjeta */
        .card-shine {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 12px;
            background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(255,255,255,0.12) 0%, transparent 70%);
            pointer-events: none;
            mix-blend-mode: overlay;
        }

        .card-inner-logo {
            color: var(--gold-primary);
            font-size: 2.2rem;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .card-inner-status {
            font-size: 0.7rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 1.1rem;
            font-weight: 500;
            letter-spacing: 1px;
            margin-bottom: 10px;
            color: var(--text-main);
        }

        p {
            color: var(--text-muted);
            font-size: 0.82rem;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .btn-claim {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: linear-gradient(135deg, #dfb15b 0%, #b88d3e 100%);
            color: #000000;
            text-decoration: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(223, 177, 91, 0.25);
        }

        .btn-claim:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(223, 177, 91, 0.4);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="container">
        <div class="brand-logo">linkea.fy</div>
        <div class="card-id-badge" id="badgeId">Tarjeta en Stock</div>

        <!-- Tarjeta Interactiva Viva 3D -->
        <div class="card-tilt-container" id="tiltCard">
            <div class="physical-card-live" id="cardElement">
                <div class="card-shine" id="cardShine"></div>
                <div class="card-inner-logo">linkea.fy</div>
                <div class="card-inner-status">Espacio Disponible</div>
            </div>
        </div>

        <h1>Tu marca merece este nivel</h1>
        <p>Esta tarjeta física <strong>Black Gold</strong> está lista para ser programada. Desliza tu dedo o mueve el cursor sobre ella para sentir su acabado metálico interactivo.</p>

        <!-- Botón de WhatsApp con ID dinámico -->
        <a id="whatsappBtn" href="#" target="_blank" class="btn-claim">
            <i class="fa-brands fa-whatsapp"></i> Reclamar esta Tarjeta
        </a>
    </div>

    <script>
        // Detección automática del ID desde la URL
        const pathSegments = window.location.pathname.split('/');
        const folderId = pathSegments[pathSegments.length - 2] || pathSegments[pathSegments.length - 1];
        
        let currentId = "0001";
        if (folderId && folderId !== "t" && folderId !== "") {
            currentId = folderId;
            document.getElementById('badgeId').innerText = `Tarjeta #${currentId}`;
        }

        // Configurar enlace de WhatsApp con el ID detectado
        const mensajeWa = encodeURIComponent(`Hola, tengo en mis manos la tarjeta linkea.fy con el ID #${currentId} y quiero activarla para mi negocio.`);
        document.getElementById('whatsappBtn').href = `https://wa.me/TU_NUMERO_DE_WHATSAPP?text=${mensajeWa}`;

        // ==========================================
        // EFECTO TILT 3D INTERACTIVO (MOUSE Y TOUCH)
        // ==========================================
        const cardContainer = document.getElementById('tiltCard');
        const card = document.getElementById('cardElement');
        const shine = document.getElementById('cardShine');

        function handleMove(clientX, clientY) {
            const rect = card.getBoundingClientRect();
            const x = clientX - rect.left; // Posición X dentro de la tarjeta
            const y = clientY - rect.top;  // Posición Y dentro de la tarjeta

            const centerX = rect.width / 2;
            const centerY = rect.height / 2;

            // Calcular rotación basada en la distancia al centro (máximo 15 grados)
            const rotateX = -((y - centerY) / centerY) * 15;
            const rotateY = ((x - centerX) / centerX) * 15;

            card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.03)`;
            
            // Mover el brillo holográfico siguiendo el cursor
            shine.style.setProperty('--mouse-x', `${(x / rect.width) * 100}%`);
            shine.style.setProperty('--mouse-y', `${(y / rect.height) * 100}%`);
        }

        // Eventos para Computadora (Mouse)
        cardContainer.addEventListener('mousemove', (e) => {
            handleMove(e.clientX, e.clientY);
        });

        cardContainer.addEventListener('mouseleave', () => {
            card.style.transform = `rotateX(0deg) rotateY(0deg) scale(1)`;
            shine.style.setProperty('--mouse-x', `50%`);
            shine.style.setProperty('--mouse-y', `50%`);
        });

        // Eventos para Celulares y Tablets (Touch)
        cardContainer.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                const touch = e.touches[0];
                handleMove(touch.clientX, touch.clientY);
            }
        });

        cardContainer.addEventListener('touchend', () => {
            card.style.transform = `rotateX(0deg) rotateY(0deg) scale(1)`;
        });
    </script>
</body>
</html>
