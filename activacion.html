<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espacio Disponible | linkea.fy</title>
    <!-- Librería para generar el QR dinámico -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #050507;
            --gold-primary: #dfb15b;
            --gold-glow: rgba(223, 177, 91, 0.4);
            --text-main: #ffffff;
            --text-muted: #88888c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #18181c 0%, #0d0d0f 35%, #1a1a1e 70%, #050507 100%);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Aura de luz animada más envolvente */
        .bg-glow {
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, var(--gold-glow) 0%, rgba(0,0,0,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            filter: blur(60px);
            pointer-events: none;
            animation: pulseGlow 5s infinite ease-in-out;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.3; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.7; transform: translate(-50%, -50%) scale(1.15); }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 420px;
            width: 100%;
            background: rgba(14, 14, 17, 0.88);
            border: 1px solid rgba(223, 177, 91, 0.3);
            border-radius: 24px;
            padding: 35px 22px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.95), 0 0 30px rgba(223, 177, 91, 0.15);
            backdrop-filter: blur(15px);
            animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .brand-logo {
            color: var(--gold-primary);
            font-size: 2.3rem;
            font-weight: 400;
            letter-spacing: 1.5px;
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(223, 177, 91, 0.4);
            animation: fadeInDown 0.9s ease-out;
        }

        .card-id-badge {
            display: inline-block;
            background: rgba(223, 177, 91, 0.12);
            color: var(--gold-primary);
            border: 1px solid rgba(223, 177, 91, 0.35);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.7rem;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            margin-bottom: 20px;
            font-weight: 600;
            box-shadow: 0 0 10px rgba(223, 177, 91, 0.1);
        }

        /* ==========================================
           CONTENEDOR 3D FLIP & TILT ÉPICO
           ========================================== */
        .card-tilt-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 22px;
            perspective: 1200px;
            cursor: pointer;
            touch-action: none;
        }

        .card-3d-scene {
            width: 340px;
            height: 200px;
            position: relative;
            transform-style: preserve-3d;
            /* Transición fluida para el seguimiento del mouse */
            transition: transform 0.15s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* CLASE CLAVE PARA EL GIRO LENTO Y CINEMATOGRÁFICO */
        .card-3d-scene.animating-flip {
            transition: transform 0.85s cubic-bezier(0.4, 0, 0.2, 1) !important;
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0; left: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 14px;
            background: linear-gradient(135deg, #18181c 0%, #0d0d0f 35%, #1a1a1e 70%, #050507 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.95), inset 0 1px 2px rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(223, 177, 91, 0.35);
            padding: 20px;
        }

        .card-back {
            transform: rotateY(180deg);
            text-align: center;
        }

        .qr-frame-minimal {
            background: #ffffff;
            padding: 5px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.6);
        }

        .qr-frame-minimal img, .qr-frame-minimal canvas {
            display: block;
            width: 66px !important;
            height: 66px !important;
        }

        .card-inner-logo {
            color: var(--gold-primary);
            font-size: 1.8rem;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .card-shine {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 14px;
            background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(255,255,255,0.15) 0%, transparent 70%);
            pointer-events: none;
            mix-blend-mode: overlay;
        }

        /* Botón de giro elegante */
        .btn-flip {
            background: rgba(223, 177, 91, 0.08);
            color: var(--gold-primary);
            border: 1px solid rgba(223, 177, 91, 0.3);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.72rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            margin-bottom: 22px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-flip:hover {
            background: var(--gold-primary);
            color: #000;
            box-shadow: 0 0 15px rgba(223, 177, 91, 0.4);
            transform: translateY(-2px);
        }

        h1 {
            font-size: 1.15rem;
            font-weight: 500;
            letter-spacing: 1px;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        p {
            color: var(--text-muted);
            font-size: 0.82rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .btn-claim {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: linear-gradient(135deg, #dfb15b 0%, #b88d3e 100%);
            color: #000000;
            text-decoration: none;
            padding: 15px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(223, 177, 91, 0.3);
        }

        .btn-claim:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(223, 177, 91, 0.5);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="container">
        <div class="brand-logo">linkea.fy</div>
        <div class="card-id-badge" id="badgeId">Tarjeta en Stock</div>

        <!-- Tarjeta Interactiva 3D -->
        <div class="card-tilt-container" id="tiltContainer">
            <div class="card-3d-scene" id="cardScene">
                <!-- CARA FRONTAL (Logo + QR Real) -->
                <div class="card-face card-front">
                    <div class="card-shine"></div>
                    <div class="card-inner-logo">linkea.fy</div>
                    <div class="qr-frame-minimal" id="qrContainer"></div>
                </div>
                <!-- CARA TRASERA (DORSO) -->
                <div class="card-face card-back">
                    <div class="card-shine"></div>
                    <div style="font-size: 0.9rem; color: var(--gold-primary); letter-spacing: 3px; font-weight: 600; margin-bottom: 8px;">BLACK GOLD</div>
                    <div style="font-size: 0.75rem; color: var(--text-muted); line-height: 1.5;">Tecnología NFC & QR Integrada<br>Espacio Exclusivo Disponible</div>
                </div>
            </div>
        </div>

        <!-- Botón para voltear la tarjeta con animación épica -->
        <button class="btn-flip" id="flipBtn">
            <i class="fa-solid fa-rotate"></i> Girar Tarjeta
        </button>

        <h1>Tu marca merece este nivel</h1>
        <p>Explora el acabado metálico de alta gama interactuando con la tarjeta en 3D. Gírala para descubrir su diseño integral.</p>

        <!-- Botón de WhatsApp con ID dinámico -->
        <a id="whatsappBtn" href="#" target="_blank" class="btn-claim">
            <i class="fa-brands fa-whatsapp"></i> Reclamar esta Tarjeta
        </a>
    </div>

    <script>
        // Detección automática del ID desde la URL
        const pathSegments = window.location.pathname.split('/');
        let folderId = pathSegments[pathSegments.length - 2] || pathSegments[pathSegments.length - 1];
        
        let currentId = "0001";
        if (folderId && folderId !== "t" && folderId !== "") {
            currentId = folderId;
        }

        document.getElementById('badgeId').innerText = `Tarjeta #${currentId}`;

        // Generar el código QR apuntando a la propia página
        const currentUrl = window.location.href;
        new QRCode(document.getElementById("qrContainer"), {
            text: currentUrl,
            width: 66,
            height: 66,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });

        // Configurar enlace de WhatsApp
        const mensajeWa = encodeURIComponent(`Hola, tengo en mis manos la tarjeta linkea.fy con el ID #${currentId} y quiero activarla para mi negocio.`);
        document.getElementById('whatsappBtn').href = `https://wa.me/TU_NUMERO_DE_WHATSAPP?text=${mensajeWa}`;

        // ==========================================
        // CONTROL 3D TILT & GIRO ÉPICO LENTO
        // ==========================================
        const container = document.getElementById('tiltContainer');
        const scene = document.getElementById('cardScene');
        const flipBtn = document.getElementById('flipBtn');

        let isFlipped = false;
        let currentRotateX = 0;
        let currentRotateY = 0;

        function updateTransform() {
            const flipAngle = isFlipped ? 180 : 0;
            scene.style.transform = `rotateX(${currentRotateX}deg) rotateY(${currentRotateY + flipAngle}deg)`;
        }

        // Activamos la clase de animación lenta y cinemática al presionar el botón de giro
        flipBtn.addEventListener('click', () => {
            isFlipped = !isFlipped;
            scene.classList.add('animating-flip');
            updateTransform();

            // Quitamos la clase temporal para que el movimiento con el mouse vuelva a ser inmediato al terminar el giro
            setTimeout(() => {
                scene.classList.remove('animating-flip');
            }, 850);
        });

        function handleMove(clientX, clientY) {
            // Si está girando de manera épica, evitamos interferir con el mouse
            if (scene.classList.contains('animating-flip')) return;

            const rect = container.getBoundingClientRect();
            const x = clientX - rect.left;
            const y = clientY - rect.top;

            const centerX = rect.width / 2;
            const centerY = rect.height / 2;

            currentRotateX = -((y - centerY) / centerY) * 10;
            currentRotateY = ((x - centerX) / centerX) * 10;

            updateTransform();
        }

        container.addEventListener('mousemove', (e) => {
            handleMove(e.clientX, e.clientY);
        });

        container.addEventListener('mouseleave', () => {
            if (scene.classList.contains('animating-flip')) return;
            currentRotateX = 0;
            currentRotateY = 0;
            updateTransform();
        });

        container.addEventListener('touchmove', (e) => {
            e.preventDefault(); 
            if (e.touches.length > 0) {
                const touch = e.touches[0];
                handleMove(touch.clientX, touch.clientY);
            }
        }, { passive: false });

        container.addEventListener('touchend', () => {
            if (scene.classList.contains('animating-flip')) return;
            currentRotateX = 0;
            currentRotateY = 0;
            updateTransform();
        });
    </script>
</body>
</html>
