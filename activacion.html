<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espacio Disponible | linkea.fy</title>
    <!-- Librería para generar el QR dinámico -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #050507;
            --gold-primary: #dfb15b;
            --gold-glow: rgba(223, 177, 91, 0.35);
            --text-main: #ffffff;
            --text-muted: #88888c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #18181c 0%, #0d0d0f 35%, #1a1a1e 70%, #050507 100%);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Aura ambiental multicapa */
        .bg-glow {
            position: absolute;
            width: 480px;
            height: 480px;
            background: radial-gradient(circle, var(--gold-glow) 0%, rgba(223, 177, 91, 0.05) 50%, rgba(0,0,0,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            filter: blur(60px);
            pointer-events: none;
            animation: pulseGlow 6s infinite ease-in-out;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.4; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.18); }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 420px;
            width: 100%;
            background: rgba(14, 14, 17, 0.88);
            border: 1px solid rgba(223, 177, 91, 0.3);
            border-radius: 24px;
            padding: 35px 22px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.95), 0 0 35px rgba(223, 177, 91, 0.15);
            backdrop-filter: blur(15px);
            animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .brand-logo {
            color: var(--gold-primary);
            font-size: 2.3rem;
            font-weight: 400;
            letter-spacing: 1.5px;
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(223, 177, 91, 0.4);
            animation: fadeInDown 0.9s ease-out;
        }

        .card-id-badge {
            display: inline-block;
            background: rgba(223, 177, 91, 0.12);
            color: var(--gold-primary);
            border: 1px solid rgba(223, 177, 91, 0.35);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.7rem;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            margin-bottom: 20px;
            font-weight: 600;
            box-shadow: 0 0 10px rgba(223, 177, 91, 0.1);
        }

        /* ==========================================
           CONTENEDOR 3D Y ESTABILIZACIÓN MÓVIL
           ========================================== */
        .card-tilt-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 22px;
            perspective: 1200px;
            cursor: pointer;
            touch-action: none;
        }

        .card-3d-scene {
            width: 340px;
            height: 200px;
            position: relative;
            transform-style: preserve-3d;
            will-change: transform;
            transition: transform 0.12s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        .card-3d-scene.animating-flip {
            transition: transform 0.95s cubic-bezier(0.19, 1, 0.22, 1) !important;
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0; 
            left: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 14px;
            background: linear-gradient(135deg, #1d1d22 0%, #0d0d0f 35%, #1a1a1e 70%, #050507 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.95), inset 0 1px 2px rgba(255, 255, 255, 0.25);
            border: 1px solid rgba(223, 177, 91, 0.38);
            padding: 20px;
            overflow: hidden;
        }

        .card-front {
            transform: rotateY(0deg);
            z-index: 2;
        }

        .card-back {
            transform: rotateY(180deg);
            text-align: center;
            z-index: 1;
        }

        .qr-frame-minimal {
            background: #ffffff;
            padding: 5px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.6);
            z-index: 2;
        }

        .qr-frame-minimal img, .qr-frame-minimal canvas {
            display: block;
            width: 66px !important;
            height: 66px !important;
        }

        .card-inner-logo {
            color: var(--gold-primary);
            font-size: 1.8rem;
            font-weight: 400;
            letter-spacing: 0.5px;
            z-index: 2;
        }

        /* ==========================================
           DESTELLO METÁLICO FLUIDO
           ========================================== */
        .card-face::before {
            content: '';
            position: absolute;
            top: -75%;
            left: -75%;
            width: 250%;
            height: 250%;
            background: linear-gradient(
                115deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.03) 38%,
                rgba(255, 220, 150, 0.45) 50%,
                rgba(255, 255, 255, 0.03) 62%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: rotate(25deg) translateY(-100%);
            animation: ultraShine 2.2s infinite cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            mix-blend-mode: color-dodge;
            z-index: 1;
        }

        .card-back::before {
            animation-delay: 1.1s;
        }

        @keyframes ultraShine {
            0% {
                transform: rotate(25deg) translateY(-120%);
                opacity: 0;
            }
            15% { opacity: 1; }
            85% { opacity: 1; }
            100% {
                transform: rotate(25deg) translateY(120%);
                opacity: 0;
            }
        }

        .card-shine {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 14px;
            background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(255,255,255,0.18) 0%, transparent 65%);
            pointer-events: none;
            mix-blend-mode: overlay;
            z-index: 3;
        }

        .btn-flip {
            background: rgba(223, 177, 91, 0.08);
            color: var(--gold-primary);
            border: 1px solid rgba(223, 177, 91, 0.3);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.72rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            margin-bottom: 22px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-flip:hover {
            background: var(--gold-primary);
            color: #000;
            box-shadow: 0 0 20px rgba(223, 177, 91, 0.45);
            transform: translateY(-2px);
        }

        h1 {
            font-size: 1.15rem;
            font-weight: 500;
            letter-spacing: 1px;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        p {
            color: var(--text-muted);
            font-size: 0.82rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .btn-claim {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: linear-gradient(135deg, #dfb15b 0%, #b88d3e 100%);
            color: #000000;
            text-decoration: none;
            padding: 15px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(223, 177, 91, 0.3);
        }

        .btn-claim:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(223, 177, 91, 0.5);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="container">
        <div class="brand-logo">linkea.fy</div>
        <div class="card-id-badge" id="badgeId">Cargando ID...</div>

        <!-- Tarjeta Interactiva 3D HD -->
        <div class="card-tilt-container" id="tiltContainer">
            <div class="card-3d-scene" id="cardScene">
                <!-- CARA FRONTAL -->
                <div class="card-face card-front">
                    <div class="card-shine"></div>
                    <div class="card-inner-logo">linkea.fy</div>
                    <div class="qr-frame-minimal" id="qrContainer"></div>
                </div>
                <!-- CARA TRASERA (DORSO) -->
                <div class="card-face card-back">
                    <div class="card-shine"></div>
                    <div style="font-size: 0.95rem; color: var(--gold-primary); letter-spacing: 3px; font-weight: 600; margin-bottom: 8px; z-index: 2;">BLACK GOLD</div>
                    <div style="font-size: 0.75rem; color: var(--text-muted); line-height: 1.5; z-index: 2;">Tecnología NFC & QR Integrada<br>Espacio Exclusivo Disponible</div>
                </div>
            </div>
        </div>

        <!-- Botón para voltear la tarjeta -->
        <button class="btn-flip" id="flipBtn">
            <i class="fa-solid fa-rotate"></i> Girar Tarjeta
        </button>

        <h1>Tu marca merece este nivel</h1>
        <p>Explora el acabado metálico de alta gama interactuando con la tarjeta en 3D. Gírala para descubrir su diseño integral.</p>

        <!-- Botón de WhatsApp con ID dinámico -->
        <a id="whatsappBtn" href="#" target="_blank" class="btn-claim">
            <i class="fa-brands fa-whatsapp"></i> Reclamar esta Tarjeta
        </a>
    </div>

    <script>
        // ==========================================
        // 1. EXTRACCIÓN AUTOMÁTICA DEL ID DESDE LA URL
        // ==========================================
        const pathSegments = window.location.pathname.split('/').filter(Boolean);
        let currentId = "0001";
        
        for (let i = pathSegments.length - 1; i >= 0; i--) {
            let seg = pathSegments[i];
            if (!seg.includes('.html') && seg !== 't' && seg !== 'linkea.fy') {
                currentId = seg;
                break;
            }
        }

        // Mostrar ID preliminar
        document.getElementById('badgeId').innerText = `Tarjeta #${currentId}`;

        // ==========================================
        // 2. LECTURA EN TIEMPO REAL DESDE tarjetas.json
        // ==========================================
        async function checkCardData() {
            try {
                // Ajusta la ruta relativa de tarjetas.json según dónde esté guardado este archivo
                const response = await fetch('../../tarjetas.json');
                if (response.ok) {
                    const data = await response.json();
                    
                    // Si data es un objeto o array, buscamos si el ID existe en el JSON centralizado
                    let tarjetaInfo = null;
                    if (Array.isArray(data)) {
                        tarjetaInfo = data.find(item => item.id === currentId || item.id == Number(currentId));
                    } else if (typeof data === 'object' && data !== null) {
                        tarjetaInfo = data[currentId];
                    }

                    // Si ya fue asignado a un negocio en el JSON, opcionalmente puedes redirigir o actualizar datos
                    if (tarjetaInfo && tarjetaInfo.urlDestino) {
                        // Opcional: Si deseas que redirija automáticamente cuando se active:
                        // window.location.href = tarjetaInfo.urlDestino;
                    }
                }
            } catch (error) {
                console.log("Modo local o JSON pendiente de sincronización:", error);
            }
        }

        checkCardData();

        // Generar el código QR dinámico apuntando a la URL actual
        const currentUrl = window.location.href;
        new QRCode(document.getElementById("qrContainer"), {
            text: currentUrl,
            width: 66,
            height: 66,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });

        // Configurar enlace de WhatsApp con el ID automático en tiempo real
        const mensajeWa = encodeURIComponent(`Hola, tengo en mis manos la tarjeta linkea.fy con el ID #${currentId} y quiero activarla para mi negocio.`);
        document.getElementById('whatsappBtn').href = `https://wa.me/TU_NUMERO_DE_WHATSAPP?text=${mensajeWa}`;

        // ==========================================
        // 3. CONTROL 3D TILT & GIRO ÉPICO TÁCTIL SEGURO
        // ==========================================
        const container = document.getElementById('tiltContainer');
        const scene = document.getElementById('cardScene');
        const flipBtn = document.getElementById('flipBtn');

        let isFlipped = false;
        let currentRotateX = 0;
        let currentRotateY = 0;

        function updateTransform() {
            const flipAngle = isFlipped ? 180 : 0;
            scene.style.transform = `rotateX(${currentRotateX}deg) rotateY(${currentRotateY + flipAngle}deg)`;
        }

        flipBtn.addEventListener('click', () => {
            isFlipped = !isFlipped;
            scene.classList.add('animating-flip');
            updateTransform();

            setTimeout(() => {
                scene.classList.remove('animating-flip');
            }, 950);
        });

        function handleMove(clientX, clientY) {
            if (scene.classList.contains('animating-flip')) return;

            const rect = container.getBoundingClientRect();
            const x = clientX - rect.left;
            const y = clientY - rect.top;

            const centerX = rect.width / 2;
            const centerY = rect.height / 2;

            currentRotateX = -((y - centerY) / centerY) * 12;
            currentRotateY = ((x - centerX) / centerX) * 12;

            updateTransform();
        }

        container.addEventListener('mousemove', (e) => {
            handleMove(e.clientX, e.clientY);
        });

        container.addEventListener('mouseleave', () => {
            if (scene.classList.contains('animating-flip')) return;
            currentRotateX = 0;
            currentRotateY = 0;
            updateTransform();
        });

        container.addEventListener('touchmove', (e) => {
            e.preventDefault(); 
            if (e.touches.length > 0) {
                const touch = e.touches[0];
                handleMove(touch.clientX, touch.clientY);
            }
        }, { passive: false });

        container.addEventListener('touchend', () => {
            if (scene.classList.contains('animating-flip')) return;
            currentRotateX = 0;
            currentRotateY = 0;
            updateTransform();
        });
    </script>
</body>
</html>
